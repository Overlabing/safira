# Source of truth for the Xcode project: `xcodegen generate` writes Safira.xcodeproj, which is not committed.
name: Safira
options:
  bundleIdPrefix: com.overlabing
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  # XcodeGen 2.45.3 knows no Xcode 27 format; xcode16_3 is the newest it can write and Xcode 27.1 opens it.
  projectFormat: xcode16_3
# Benchmark is Release with the benchmark mode compiled in and a throwaway bundle id, for the memory measurement (scripts/bench-memory.sh). It is never distributed; scripts/check.sh proves Release has none of it.
configs:
  Debug: debug
  Release: release
  Benchmark: release
packages:
  SafiraKit:
    path: Packages/SafiraKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  ThemeKit:
    url: https://github.com/Overlabing/ThemeKit
    exactVersion: 0.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
targets:
  Safira:
    type: application
    platform: macOS
    sources: [App/macOS]
    scheme: {}
    dependencies:
      - package: SafiraKit
        products: [SafiraCore, SafiraStore, SafiraSession, SafiraWeb, Commands, LinkRouting, LinkPickerUI, Diagnostics, Onboarding, Appearance]
      - package: ThemeKit
        products: [ColorCore, ColorPlatform, ColorUI]
      - package: Sparkle
        product: Sparkle
        # Re-signs Sparkle.framework with the app's identity on copy: an ad hoc app refuses a framework that keeps
        # Sparkle's own Team ID (library validation), and the release export needs the copy re-signed anyway.
        codeSign: true
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        # Registers Safira for web links and local HTML files, which lets the user choose it as the default browser
        # (docs/architecture-v1.md §5.2). WebKit also gives a handler of http and https the browser cache model.
        CFBundleURLTypes:
          - CFBundleURLName: Web address
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        # Alternate: opening HTML files with Safira is the user's choice, in Finder or in the default browser setting;
        # installing Safira does not take them from another app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, public.xhtml]
        LSApplicationCategoryType: public.app-category.productivity
        # A browser loads the HTTP pages the user chose to continue to; the system does not stop web content for lack of TLS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # Camera, microphone and location are asked for by the sites a Profile visits, never at launch: the system asks
        # once, the first time a site the user allowed really uses one (docs/architecture-v1.md §4.7).
        NSCameraUsageDescription: A website you allow in the current Profile can use the camera. Safira never uses it for itself.
        NSMicrophoneUsageDescription: A website you allow in the current Profile can use the microphone. Safira never uses it for itself.
        NSLocationUsageDescription: A website you allow in the current Profile can read your location. Safira never uses it for itself.
        NSLocationWhenInUseUsageDescription: A website you allow in the current Profile can read your location. Safira never uses it for itself.
        # Sparkle, opt-in (docs/architecture-v1.md §8.4). A missing SUEnableAutomaticChecks makes Sparkle ask the user on
        # the second launch, which would be an unrequested update prompt, so it is explicit. SUEnableSystemProfiling is
        # deliberately absent (off by default) and an update never installs without the user's click.
        SUFeedURL: https://overlabing.github.io/safira/appcast.xml
        SUPublicEDKey: CZ4T8RIDmlDLTZkEEQ0Dmvi6Z1kLEHAjvKsVeoYFVZg=
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        # Required by Sparkle under the App Sandbox: the Installer XPC service installs updates outside the sandbox.
        SUEnableInstallerLauncherService: true
    entitlements:
      # xcodegen rewrites this file from `properties` on every generate: every key lives here, never only in the file.
      path: App/macOS/Safira.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The Debug mode export is saved where the user chooses, through the save panel. Debug builds use the hand-kept
        # Safira.Debug.entitlements, which carries the same key.
        com.apple.security.files.user-selected.read-write: true
        # Downloads are saved in the user's Downloads folder (docs/architecture-v1.md §4.5, §8.2).
        com.apple.security.files.downloads.read-write: true
        # What WebKit needs for a site the user allowed to use the camera, the microphone or the location; sites ask per
        # Profile and nothing is allowed by default (docs/architecture-v1.md §4.7, §8.2).
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
        # Keeps the Slack folder the user grants once, across launches (Link rules, #20).
        com.apple.security.files.bookmarks.app-scope: true
        # Sparkle's installer launcher and status connections (Sparkle sandboxing guide); the only entitlements added for updates.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.overlabing.safira
        PRODUCT_NAME: Safira
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/macOS/Safira.entitlements
        # Ad hoc signatures carry no Team ID, so library validation rejects the embedded Sparkle.framework. Debug builds
        # add disable-library-validation through a hand-kept copy of the entitlements; Release (Developer ID, one Team
        # ID for the app and Sparkle) uses the generated file and keeps library validation on.
        "CODE_SIGN_ENTITLEMENTS[config=Debug]": App/macOS/Safira.Debug.entitlements
        # Ad hoc like Debug, so the same library validation exception; plus read access to the folder that holds the
        # list of addresses, which exists only in this configuration.
        "CODE_SIGN_ENTITLEMENTS[config=Benchmark]": App/macOS/Safira.Benchmark.entitlements
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[config=Benchmark]": BENCHMARK
        # Another identity than the app Antonin uses (its container and defaults stay untouched).
        "PRODUCT_BUNDLE_IDENTIFIER[config=Benchmark]": com.overlabing.safira.bench
        ENABLE_HARDENED_RUNTIME: YES
        # Ad hoc signing needs no certificate or secret, so the same build runs signed and sandboxed locally and in CI.
        # Developer ID signing for distribution belongs to the release script (docs/architecture-v1.md §8.3).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Xcode drops the hardened runtime from ad hoc signatures ("Disabling hardened runtime with ad-hoc codesigning");
        # the flag puts it back.
        OTHER_CODE_SIGN_FLAGS: --options=runtime
        # Under the hardened runtime, library validation refuses Xcode's separate debug dylib: an ad hoc signature has no
        # Team ID to match. It only serves SwiftUI previews.
        ENABLE_DEBUG_DYLIB: NO
